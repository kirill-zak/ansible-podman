---
- name: Converge
  hosts: all
  # The podman driver already connects as root inside the container, so there
  # is no need to escalate via sudo. Under the rootless podman available on
  # GitHub runners, sudo in the systemd-based AlmaLinux/Rocky/Fedora images
  # fails with "PAM account management error" (PAM cannot retrieve
  # authentication info in the user namespace); connecting as root without
  # become avoids sudo altogether.
  become: false

  pre_tasks:
    - name: Wait for systemd to complete initialization.  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-system-running
      register: systemctl_status
      until: >
        'running' in systemctl_status.stdout or
        'degraded' in systemctl_status.stdout
      retries: 30
      delay: 5
      when: ansible_service_mgr == 'systemd'
      changed_when: false
      failed_when: systemctl_status.rc > 1

  tasks:
    - name: "Include kirill_zak.podman"
      ansible.builtin.include_role:
        name: "kirill_zak.podman"
