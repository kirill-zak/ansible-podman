---
- name: Include AlmaLinux install task
  ansible.builtin.include_tasks: install/almalinux.yml
  when: ansible_distribution == 'AlmaLinux'

- name: Include Alpine Linux install task
  ansible.builtin.include_tasks: install/alpine.yml
  when: ansible_distribution == 'Alpine'

- name: Include CentOS install task
  ansible.builtin.include_tasks: install/centos.yml
  when: ansible_distribution == 'CentOS'

- name: Include Debian install task
  ansible.builtin.include_tasks: install/debian.yml
  when: ansible_distribution == 'Debian'

- name: Include Fedora install task
  ansible.builtin.include_tasks: install/fedora.yml
  when: ansible_distribution == 'Fedora'

- name: Include Ubuntu install task
  ansible.builtin.include_tasks: install/ubuntu.yml
  when: ansible_distribution == 'Ubuntu'

- name: Include post post process task
  ansible.builtin.include_tasks: post_process.yml
