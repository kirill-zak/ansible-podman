---
name: Release
'on':
  push:
    tags:
      # Role release tags: x.x.x or x.xx.xx (optionally prefixed with 'v'),
      # e.g. '3.0.0' or 'v2.0.0'. Only such tags trigger a Galaxy release.
      # Glob dialect note: GitHub's tag filters use * (any chars), + (one or
      # more of the preceding), ? (zero or one). Use + so single-digit parts
      # match.
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest

    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Parse and validate tag
        run: |
          tag="${GITHUB_REF_NAME#v}"

          if [[ ! "$tag" =~ ^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Unexpected tag '${GITHUB_REF_NAME}'. Expected x.x.x or x.xx.xx (e.g. '3.0.0', 'v2.0.0')."
            exit 1
          fi
          echo "Valid release tag: ${tag}"

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  test-almalinux:
    name: Molecule test - AlmaLinux 9.x
    uses: ./.github/workflows/test-image.yml
    needs: lint
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        tag: ['9.0', '9.1', '9.2']

    with:
      distro: kirillzak/docker-almalinux-ansible
      tag: ${{ matrix.tag }}
      ref: ${{ github.sha }}

  test-alpine-3-16:
    name: Molecule test - Alpine Linux 3.16.x
    uses: ./.github/workflows/test-image.yml
    needs: lint
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        tag: ['3.16.0', '3.16.1', '3.16.2', '3.16.3', '3.16.4', '3.16.5']

    with:
      distro: kirillzak/docker-alpine-ansible
      tag: ${{ matrix.tag }}
      ref: ${{ github.sha }}

  test-alpine-3-17:
    name: Molecule test - Alpine Linux 3.17.x
    uses: ./.github/workflows/test-image.yml
    needs: lint
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        tag: ['3.17.0', '3.17.1', '3.17.2', '3.17.3']

    with:
      distro: kirillzak/docker-alpine-ansible
      tag: ${{ matrix.tag }}
      ref: ${{ github.sha }}

  test-alpine-3-18:
    name: Molecule test - Alpine Linux 3.18.x
    uses: ./.github/workflows/test-image.yml
    needs: lint
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        tag: ['3.18.0']

    with:
      distro: kirillzak/docker-alpine-ansible
      tag: ${{ matrix.tag }}
      ref: ${{ github.sha }}

  test-centos:
    name: Molecule test - CentOS
    uses: ./.github/workflows/test-image.yml
    needs: lint
    permissions:
      contents: read

    with:
      distro: geerlingguy/docker-centos8-ansible
      ref: ${{ github.sha }}

  test-debian:
    name: Molecule test - Debian
    uses: ./.github/workflows/test-image.yml
    needs: lint
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        tag: ['11']

    with:
      distro: kirillzak/docker-debian-ansible
      tag: ${{ matrix.tag }}
      ref: ${{ github.sha }}

  test-fedora:
    name: Molecule test - Fedora Linux
    uses: ./.github/workflows/test-image.yml
    needs: lint
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        tag: ['36', '37', '38']

    with:
      distro: kirillzak/docker-fedora-ansible
      tag: ${{ matrix.tag }}
      ref: ${{ github.sha }}

  test-ubuntu:
    name: Molecule test - Ubuntu
    uses: ./.github/workflows/test-image.yml
    needs: lint
    permissions:
      contents: read

    with:
      distro: kirillzak/docker-ubuntu-ansible
      tag: '22.04'
      ref: ${{ github.sha }}

  release:
    name: Release
    runs-on: ubuntu-latest

    needs:
      - validate-tag
      - lint
      - test-almalinux
      - test-alpine-3-16
      - test-alpine-3-17
      - test-alpine-3-18
      - test-centos
      - test-debian
      - test-fedora
      - test-ubuntu

    steps:
      - name: Notify ansible-galaxy
        uses: robertdebock/galaxy-action@1.2.0
        with:
          galaxy_api_key: ${{ secrets.galaxy_api_key }}