---
name: CI
'on':
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  test-almalinux:
    name: Molecule test - AlmaLinux 9.x
    uses: ./.github/workflows/test-image.yml
    needs: lint
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        tag: ['9.0', '9.1', '9.2']

    with:
      distro: kirillzak/docker-almalinux-ansible
      tag: ${{ matrix.tag }}
      ref: ${{ github.sha }}

  test-alpine-3-16:
    name: Molecule test - Alpine Linux 3.16.x
    uses: ./.github/workflows/test-image.yml
    needs: lint
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        tag: ['3.16.0', '3.16.1', '3.16.2', '3.16.3', '3.16.4', '3.16.5']

    with:
      distro: kirillzak/docker-alpine-ansible
      tag: ${{ matrix.tag }}
      ref: ${{ github.sha }}

  test-alpine-3-17:
    name: Molecule test - Alpine Linux 3.17.x
    uses: ./.github/workflows/test-image.yml
    needs: lint
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        tag: ['3.17.0', '3.17.1', '3.17.2', '3.17.3']

    with:
      distro: kirillzak/docker-alpine-ansible
      tag: ${{ matrix.tag }}
      ref: ${{ github.sha }}

  test-alpine-3-18:
    name: Molecule test - Alpine Linux 3.18.x
    uses: ./.github/workflows/test-image.yml
    needs: lint
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        tag: ['3.18.0']

    with:
      distro: kirillzak/docker-alpine-ansible
      tag: ${{ matrix.tag }}
      ref: ${{ github.sha }}

  test-centos:
    name: Molecule test - CentOS
    uses: ./.github/workflows/test-image.yml
    needs: lint
    permissions:
      contents: read

    with:
      distro: geerlingguy/docker-centos8-ansible
      ref: ${{ github.sha }}

  test-debian:
    name: Molecule test - Debian
    uses: ./.github/workflows/test-image.yml
    needs: lint
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        tag: ['11']

    with:
      distro: kirillzak/docker-debian-ansible
      tag: ${{ matrix.tag }}
      ref: ${{ github.sha }}

  test-fedora:
    name: Molecule test - Fedora Linux
    uses: ./.github/workflows/test-image.yml
    needs: lint
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        tag: ['36', '37', '38']

    with:
      distro: kirillzak/docker-fedora-ansible
      tag: ${{ matrix.tag }}
      ref: ${{ github.sha }}

  test-ubuntu:
    name: Molecule test - Ubuntu
    uses: ./.github/workflows/test-image.yml
    needs: lint
    permissions:
      contents: read

    with:
      distro: kirillzak/docker-ubuntu-ansible
      tag: '22.04'
      ref: ${{ github.sha }}